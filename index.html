<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking</title>
    <!--css-->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/table.css">
    <link rel="stylesheet" href="css/calendar.css">
    <link rel="stylesheet" href="css/form.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
    <div class="page">
        <button id="logoutBtn"><i class="fa fa-sign-out"></i> 退出</button>
        <div class="page-up">
            <!--info-->
            <div class="page-up-btn info">
                <div class="info-content">
                    <div class="info-left">
                        <span><img src="images/hinh-anh-mat-troi-18.jpg" alt=""></span>
                    </div>
                    <div class="info-right" id="employee-info"></div>
                </div>
                <div class="tracking-btn">
                    <hr>
                    <div class="tracking-btn-up">
                        <button class="salary-btn" style="color: #FF8A65;">薪资查询</button>
                        <button style="color: #2563EB;">我的任务</button>
                    </div>
                    <button type="button" name="checkin" onclick="checkIn()"><i class="fa fa-clock-o"></i> 线上打卡</button>
                </div>
            </div>
            <!--打卡时间-->
            <div class="page-up-btn tracking tracking-time">
                <div class="tracking-up">
                    <span class="tracking-title">考勤打卡</span>
                    <hr>
                    <div class="tracking-note" id="time-line">
                        <span style="color: #2563EB;">排班时间 (09:00-18:00)</span>
                    </div>
                </div>
                <div><button class="tracking-page">本月出勤纪录</button></div>
            </div>
            <!--年假-->
            <div class="page-up-btn tracking year-time">
                <div class="tracking-up">
                    <span class="tracking-title">今年假别额度</span>
                    <hr>
                    <div class="tracking-note" id="leave-note"></div>
                </div>
                <div><button class="request-leave">请假纪录</button></div>
            </div>
        </div>
        <div class="hr-wrapper" style="padding: 0 100px;">
            <hr>
        </div>
        <div class="page-down" id="page-down">
            <div class="page-down-content">
                <div class="page-down-title">薪资查询</div>
                <table id="table-salary"></table>
            </div>
            <div class="page-down-content active">
                <div class="page-down-title">本月出勤纪录</div>
                <table id="table-attendance"></table>
            </div>
            <div class="page-down-content">
                <div class="page-down-title">请假纪录</div>
                <div class="leave-content">
                    <div class="leave-left">
                        <form action="/action_page.php">
                            <!-- Leave Type -->
                            <label for="leave-type">请假类型</label>
                            <select id="leave-type" name="leave-type">
                                <option value="annual">年假</option>
                                <option value="sick">病假</option>
                            </select>

                            <!-- Leave Duration -->
                            <label for="leave-duration">请假时长</label>
                            <select id="leave-duration" name="leave-duration">
                                <option value="day">1天</option>
                                <option value="half">半天</option>
                            </select>

                            <input type="submit" value="提交">
                        </form>
                    </div>
                    <div class="leave-right">
                        <select id="year-select">

                        </select>
                        <select id="month-select">

                        </select>
                        <div id="calendar"></div>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <!--js-->
    <script src="js/page_load.js"></script>
    <script src="js/main.js"></script>
    <script src="js/log_out.js"></script>
</body>

</html>
